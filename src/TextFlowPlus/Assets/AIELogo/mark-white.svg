<?xml version="1.0" encoding="UTF-8"?>
<!--
  TextFlowPlus 标识 — 白色版（透明底，用于深色背景 / 深色 UI / 水印）
  蓝描边方框 + 框内 T（白→淡靛渐变）与 +（琥珀三色渐变），二者分离不重叠
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC0FF"/>
      <stop offset="0.5" stop-color="#1E7BE0"/>
      <stop offset="1" stop-color="#0B4EA2"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="372">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="plus" gradientUnits="userSpaceOnUse" x1="0" y1="266" x2="0" y2="400">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect x="30" y="30" width="452" height="452" rx="104"
        fill="none" stroke="url(#frame)" stroke-width="30"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="50">
    <path d="M104 152 H284" stroke="url(#ink)"/>
    <path d="M194 152 V352" stroke="url(#ink)"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="38">
    <path d="M368 266 V400" stroke="url(#plus)"/>
    <path d="M301 333 H435" stroke="url(#plus)"/>
  </g>
</svg>