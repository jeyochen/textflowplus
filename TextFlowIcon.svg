<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="236" height="236" rx="60" ry="60" fill="url(#bgGradient)"/>

  <!-- 文档图标 -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- 文档主体 -->
    <rect x="0" y="30" width="136" height="156" rx="8" fill="url(#docGradient)"/>

    <!-- 文档折角 -->
    <path d="M 106 30 L 136 60 L 106 60 Z" fill="#e0e0e0"/>

    <!-- 文本行 -->
    <rect x="20" y="60" width="96" height="8" rx="4" fill="#667eea"/>
    <rect x="20" y="80" width="80" height="8" rx="4" fill="#a0a0a0"/>
    <rect x="20" y="100" width="90" height="8" rx="4" fill="#a0a0a0"/>
    <rect x="20" y="120" width="85" height="8" rx="4" fill="#a0a0a0"/>
    <rect x="20" y="140" width="75" height="8" rx="4" fill="#a0a0a0"/>

    <!-- 标签页 -->
    <rect x="10" y="10" width="50" height="30" rx="6" fill="#f8a5c1"/>
    <rect x="65" y="10" width="50" height="30" rx="6" fill="#78e08f"/>
  </g>

  <!-- T 字母装饰 -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">TextFlow</text>
</svg>
